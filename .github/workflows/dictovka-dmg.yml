# Бесплатная сборка Dictovka.dmg на macOS-раннере GitHub (для публичного репозитория).
# Запуск: вкладка Actions → "Dictovka DMG" → Run workflow. Готовый .dmg — в Artifacts.
name: "Dictovka DMG"

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin   # Apple Silicon (M1–M4)
          - target: x86_64-apple-darwin    # Intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install
      - name: Build
        run: bun run tauri build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.dictovka.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: Dictovka-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
