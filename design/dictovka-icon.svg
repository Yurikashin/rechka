<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="1" stop-color="#1E5BE6"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EEFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A7A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 rounded square centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <!-- capsule -->
    <rect x="417" y="230" width="190" height="330" rx="95" ry="95" fill="url(#mic)"/>
    <!-- stand arc -->
    <path d="M327 470 a185 185 0 0 0 370 0" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
    <!-- stem -->
    <line x1="512" y1="655" x2="512" y2="745" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
    <!-- base -->
    <line x1="422" y1="770" x2="602" y2="770" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  </g>
  <!-- grille hints on capsule -->
  <g stroke="#9CC3FF" stroke-width="14" stroke-linecap="round">
    <line x1="470" y1="330" x2="554" y2="330"/>
    <line x1="470" y1="380" x2="554" y2="380"/>
    <line x1="470" y1="430" x2="554" y2="430"/>
  </g>
</svg>
